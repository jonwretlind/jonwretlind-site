<html>
  <head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="./p5.min.js" type="text/javascript"></script>
    <style>


    * {box-sizing: border-box;}
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    canvas {
      position: absolute;
      z-index: -1;
      width: 100vw !important;
      height: auto !important;
    }


    .container {
    	position: absolute;
    	top: 50%;
    	left: 50%;
    	height: 100vh;
    	width: 100vw;
    	padding: 0;
    	display: grid;
    	place-items: center;
    	transform: translate(-50%, -50%);
    }
    img {
    	max-width: 100px;
    	animation: blink 10s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    @keyframes blink {
    	0% {opacity: 1;}
    	99% {opacity: 1;}
    	100% {opacity: 0;}
    }


/* STARS */

main {
  height: 100vh;
  width: 100vw;
  margin: 0;
  padding: 0;
  position: absolute;
  top: 0;
  left: 0;
}

div:not(.container) {
  display: block;
  width: 2px;
  height: 2px;
  border-radius: 6px;
  position: absolute;
  top: 0;
  left: 0;
  background: #fff;
  opacity: 0.9;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  animation: linear infinite star-anim;
  opacity: 1;
}

@keyframes star-anim {
  0% {
    opacity: 1;
  }
  50% {
    opacity: 0.2;
  }
  100% {
    opacity: 1;
  }
}

.bigtwinkle {
  position: absolute;
  background: red;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  margin: auto;
}


    </style>

  </head>
    <body>
      <main><div id="myContainer" class="container"></main>
	<img src="https://www.blacktablet.co.uk/images/pens/eye.png" alt="" />
</div>

    </body>
    <footer>
      <script src="./sketch.js" type="text/javascript" ></script>
    </footer>
</html>
