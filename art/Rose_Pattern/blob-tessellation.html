<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessellated Rose Pattern</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
  let hexSize;
let hexWidth;
let hexHeight;
let cols, rows;

function setup() {
  createCanvas(1200, 1200);
  hexSize = 30; // Size of the hexagon
  hexWidth = sqrt(3) * hexSize; // Width of hexagon calculated by sqrt(3) * side
  hexHeight = 2 * hexSize; // Height of the hexagon
  cols = int(width / hexWidth) + 1;
  rows = int(height / (hexHeight * 0.75)) + 1;
  noLoop();
}

function draw() {
  background(255);
  for (let col = 0; col < cols; col++) {
    for (let row = 0; row < rows; row++) {
      // Calculating the x and y position of the hexagon
      const x = col * hexWidth + ((row % 2) * hexWidth) / 2;
      const y = row * (hexHeight * 0.5);
      
      // Draw the randomized blobs in the hexagon
      drawBlob(x, y, getRand(hexSize,hexSize*3),color(220, 95, 226, 50)); // Red blob
      drawBlob(x, y-col/3, getRand(hexSize,hexSize*3), color(170, 6, 86, 80)); // Orange blob
    }
  }
}

function drawBlob(x, y, size, col) {
  push();
  translate(x, y);
  beginShape();
  fill(col);
  noStroke();
  // Using noise to create a randomized blob shape
  for (let angle = 0; angle < TWO_PI; angle += radians(5)) {
    let xOffset = cos(angle) * size;
    let yOffset = sin(angle) * size;
    let r = size + noise(xOffset, yOffset) * size * getRand(1, 3); // Varying the radius for the blob shape
    vertex(x + cos(angle) * r, y + sin(angle) * r);
  }
  endShape(CLOSE);
  pop();
}

function getRand(min, max) {
    return Math.random() * (max - min) + min;
}
// Call this function to initialize the sketch
setup();

    </script>
</body>
</html>
