<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessellated Rose Pattern</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        // Ensure that you have included the p5.js library in your HTML file before using this script.

function setup() {
  // Create an SVG canvas
  createCanvas(800, 800); // Set the dimensions as required
  noLoop(); // No need to loop since we're drawing a static pattern
}

function draw() {
  background(255); // White background

  const tileSize = 100; // Size of each tile, adjust as needed
  const rows = height / tileSize;
  const cols = width / tileSize;

  // Loop over the grid to create a tessellated pattern
  for (let x = 0; x < cols; x++) {
    for (let y = 0; y < rows; y++) {
      // Calculate position for each tile
      const posX = x * tileSize;
      const posY = y * tileSize;
      drawRose(posX, posY, tileSize);
    }
  }

  // Save the drawing as an SVG file
  save('tessellated_roses_pattern.svg');
}

function drawRose(x, y, size) {
  // Define the drawing of a rose here
  push(); // Start a new drawing state
  translate(x, y); // Move to the tile position

  // Drawing a simple rose pattern just for demonstration
  // You would replace this with your actual rose drawing logic
  beginShape();
  for (let angle = 0; angle < TWO_PI; angle += 0.1) {
    const r = size / 2 * cos(4 * angle); // Rose equation, adjust as needed
    const posX = r * cos(angle);
    const posY = r * sin(angle);
    vertex(posX, posY);
  }
  endShape(CLOSE);

  pop(); // Restore original state
}
    </script>
</body>
</html>
